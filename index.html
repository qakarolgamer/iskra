function sparkField(stage){const cv=stage.querySelector('canvas');if(!cv)return()=>{};const ctx=cv.getContext('2d');let W=1,H=1;const dpr=window.devicePixelRatio||1;const ps=[];
  function size(){const r=stage.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}size();
  const add=(x,y,burst)=>ps.push({x,y,vx:burst?(Math.random()-.5)*6:(Math.random()-.5)*.3,vy:burst?(Math.random()-.5)*6-1.5:-(.2+Math.random()*.5),r:burst?2+Math.random()*3:1+Math.random()*2.2,life:burst?55+Math.random()*30:300+Math.random()*300,t:burst?0:Math.random()*200,burst,c:Math.random()<.5?'255,255,255':'255,214,80',star:Math.random()<.4});
  for(let i=0;i<36;i++)add(Math.random()*W,Math.random()*H,false);
  const onDown=e=>{const r=stage.getBoundingClientRect();for(let i=0;i<24;i++)add(e.clientX-r.left,e.clientY-r.top,true);};stage.addEventListener('pointerdown',onDown);
  const stop=rafLoop(()=>{ctx.clearRect(0,0,W,H);for(let i=ps.length-1;i>=0;i--){const p=ps[i];p.t++;p.x+=p.vx;p.y+=p.vy;if(p.burst){p.vy+=.08;p.vx*=.98;}
      const a=Math.sin(Math.PI*Math.min(1,p.t/p.life));ctx.fillStyle=`rgba(${p.c},${(a*.9).toFixed(3)})`;
      if(p.star){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.t*.03);ctx.beginPath();for(let k=0;k<4;k++){ctx.lineTo(0,-p.r*2.4);ctx.rotate(Math.PI/4);ctx.lineTo(0,-p.r*.7);ctx.rotate(Math.PI/4);}ctx.closePath();ctx.fill();ctx.restore();}
      else{ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();}
      if(p.t>=p.life||p.y<-12){ps.splice(i,1);if(!p.burst)add(Math.random()*W,H+6,false);}}});
  window.addEventListener('resize',size);return()=>{stop();window.removeEventListener('resize',size);stage.removeEventListener('pointerdown',onDown);};}
function updateStreak(){const n=shownStreak();$('#streak').classList.toggle('hot',n>0);$('#streak').innerHTML=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z" fill="${n?'var(--accent)':'var(--muted)'}"/></svg>${n} ${plural(n,'dzień','dni','dni')}`;}

function radar(skills,base){
  const W=340,H=300,cx=W/2,cy=H/2+4,R=92,n=ORDER.length;
  const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[cx+Math.cos(a)*R*v/100,cy+Math.sin(a)*R*v/100];};
  let g='';
  [25,50,75,100].forEach(v=>{g+=`<polygon points="${ORDER.map((_,i)=>pt(i,v).join(',')).join(' ')}" fill="none" stroke="var(--line)" stroke-width="1"/>`;});
  ORDER.forEach((_,i)=>{const[x,y]=pt(i,100);g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/>`;});
  const has=ORDER.some(d=>skills[d]!=null);
  if(base&&ORDER.some(d=>base[d]!=null))g+=`<polygon points="${ORDER.map((d,i)=>pt(i,base[d]??0).join(',')).join(' ')}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4"/>`;
  if(has){g+=`<polygon points="${ORDER.map((d,i)=>pt(i,Math.max(4,skills[d]??0)).join(',')).join(' ')}" fill="var(--accent)" fill-opacity=".16" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" class="shape"/>`;
    ORDER.forEach((d,i)=>{if(skills[d]==null)return;const[x,y]=pt(i,Math.max(4,skills[d]));g+=`<circle class="pt" style="animation-delay:${.5+i*.07}s" cx="${x}" cy="${y}" r="6" fill="${dcol(d)}" stroke="var(--surface)" stroke-width="2"/>`;});}
  ORDER.forEach((d,i)=>{const a=-Math.PI/2+i*2*Math.PI/n;const lx=cx+Math.cos(a)*(R+16),ly=cy+Math.sin(a)*(R+16);
    const anchor=Math.abs(Math.cos(a))<0.2?'middle':Math.cos(a)>0?'start':'end';const lines=DOMAINS[d].label;
    const dy=Math.sin(a)<-0.5?-(lines.length*13+2):Math.sin(a)>0.5?12:-(lines.length*13)/2+8;
    lines.forEach((l,k)=>{g+=`<text x="${lx}" y="${ly+dy+k*13}" text-anchor="${anchor}">${l}</text>`;});
    g+=`<text class="val" x="${lx}" y="${ly+dy+lines.length*13+1}" text-anchor="${anchor}" fill="${dcol(d)}" style="fill:${dcol(d)}">${skills[d]??'–'}</text>`;});
  return `<svg class="radar" viewBox="0 0 ${W} ${H}" role="img" aria-label="Mapa umiejętności">${g}</svg>`;}

const DLEN={short:{t:'Krótki',min:5},standard:{t:'Standardowy',min:12},long:{t:'Długi',min:20}};
const EVD=['pulapki','pewnosc','przedzialy','obroty','emocje','przeformuluj','zastosowania'];
const STEP_MIN=st=>st.type==='game'?({pulapki:3,przedzialy:3,oddech:2,decyzja:2}[st.id]||2):st.type==='scene'?3:st.type==='lesson'?4:2;
const planMin=pl=>pl.reduce((a,st)=>a+STEP_MIN(st),0);
function dailyPlan(){const today=dayKey();const r=seedRand(today);const len=DLEN[S.dailyLen]?S.dailyLen:'standard';
  const ord=EVD.map(id=>({id,k:(S.skills[G(id).domain]??50)+r()*45})).sort((a,b)=>a.k-b.k).map(x=>x.id);
  const due=srsDue().length;const want=len==='short'?2:len==='long'?5:3;
  const games=['decyzja'];if(due>=3||len!=='short')games.push('fiszki');for(const id of ord){if(games.length>=want+1+(games.includes('fiszki')?1:0))break;games.push(id);}
  if(len==='long')games.push('oddech');
  const n=dayNum();const nextOf=(list,done)=>(list.find(x=>!done.includes(x.id))||list[n%list.length]).id;
  const tow=SCENES.filter(x=>x.group==='tow'),oth=SCENES.filter(x=>x.group!=='tow');
  const towLeft=tow.some(x=>!S.scenesDone.includes(x.id));const sc1={type:'scene',id:(towLeft||n%2===0)?nextOf(tow,S.scenesDone):nextOf(oth,S.scenesDone)};
  const steps=games.map(id=>({type:'game',id}));
  if(len!=='short')steps.push({type:'quiz',n:5});
  steps.push(sc1);
  if(len==='long'){const other=n%2===0?oth:tow;steps.push({type:'scene',id:nextOf(other.filter(x=>x.id!==sc1.id),S.scenesDone)});steps.push({type:'lesson',id:nextOf(LESSONS,S.lessonsDone)});}
  return steps;}
function stepLabel(st){if(st.type==='game'){const g=G(st.id);return{t:g.name,s:DOMAINS[g.domain].name,c:dcol(g.domain),who:g.domain};}
  if(st.type==='scene'){const s=SCENES.find(x=>x.id===st.id);return{t:s.title,s:'Soft skills · '+s.skill,c:'var(--ink)',who:'iskra'};}

  const l=LESSONS.find(x=>x.id===st.id);return{t:l.title,s:'Wiedza · '+l.cat,c:'var(--accent)',who:'iskra'};}

/* ===================== Przebieg treningu ===================== */
function startRun(mode,steps){RUN={mode,steps,i:0,results:[],before:clone(S.skills)};nextStep();}
function progressTxt(){return RUN&&RUN.steps.length>1?`<span class="small muted">Krok ${RUN.i+1} z ${RUN.steps.length}</span>`:'';}
function nextStep(){if(!RUN)return home();if(DEPTH>2)DEPTH=1;if(RUN.i>=RUN.steps.length)return finishRun();const st=RUN.steps[RUN.i];
  if(st.type==='game')gameIntro(G(st.id));else if(st.type==='review')review(st.ids);else if(st.type==='quiz')teleturniej(st.cat,st.n);else if(st.type==='scene')scene(SCENES.find(x=>x.id===st.id));else lesson(LESSONS.find(x=>x.id===st.id));}
function stepDone(res){RUN.results.push(res);RUN.i++;resultView(res);}

function gameIntro(g){DN=2;const lv=S.levels[g.id]||1;const c=dcol(g.domain);const ch=CHARS[g.domain];
  render(`<div class="screen"><div class="row between">${backBtn()}${progressTxt()}</div>
    <section class="intro-hero" style="--c:${c}"><div class="ih-pattern"></div><div class="ih-dom">${DOMAINS[g.domain].name}</div><h1>${g.name}</h1>
      <div class="ih-meta"><span>Poziom ${lv}</span><span>${g.time}</span>${S.best[g.id]!=null?`<span>Rekord ${S.best[g.id]}</span>`:''}</div>
      <div class="ih-m">${mascot(g.domain,'happy',118,'hop')}</div></section>
    <div class="bubble"><small style="color:${c}">${ch.name} tłumaczy</small>${g.how}</div>
    ${g.ladder?(()=>{const mx=Math.max((S.lvMax||{})[g.id]||1,lv);return`<div class="ladder" style="--c:${c}"><div class="small muted">Wybierz poziom (odblokowane: ${mx}/${g.ladder.length})</div><div class="lad-g">${g.ladder.map((t,k)=>`<button class="lad ${k+1===lv?'on':''} ${k+1>mx?'lock':''}" data-l="${k+1}" ${k+1>mx?'disabled':''}><b>${k+1>mx?'🔒':k+1}</b><span>${t}</span></button>`).join('')}</div></div>`;})():''}
    ${(()=>{const e=evOf(g);return`<div class="evid ev${e.lvl}"><b>${e.lvl>=3?'🔬':e.lvl===2?'📘':'🎯'} ${EV_LBL[e.lvl]}</b>${e.txt}</div>`;})()}
    <button class="btn primary block go-pulse" id="go" style="--accent:${c}">Start</button></div>`);
  bindBack();$('#go').onclick=()=>playGame(g);$$('.lad:not(.lock)').forEach(b=>b.onclick=()=>{S.levels[g.id]=+b.dataset.l;save();gameIntro(g);});}
function playGame(g){DN=3;const lv=S.levels[g.id]||1;const c=dcol(g.domain);
  render(`<div class="gamebar"><button class="ghost" id="quit">✕ Przerwij</button><span class="chip" style="color:${c}">${g.name}</span><span class="hud" id="hud"></span></div><div class="stage" id="stage" style="--c:${c}"></div>`);
  $('#quit').onclick=home;const hud=t=>{const h=$('#hud');if(h)h.textContent=t;};const stage=$('#stage');
  const go=()=>{cleanup=g.play(stage,lv,r=>onGameFinish(g,r),hud);};
  if(reduceMotion())return go();
  let n=3,tm=null;stage.innerHTML='<div class="count" id="cnt"></div>';const cnt=$('#cnt');
  const tick=t=>{cnt.textContent=t;cnt.classList.remove('tick');void cnt.offsetWidth;cnt.classList.add('tick');};
  const step=()=>{if(n>0){tick(n);n--;tm=setTimeout(step,560);}else{tick('Start!');tm=setTimeout(go,420);}};
  cleanup=()=>clearTimeout(tm);step();}
function onGameFinish(g,r){stopGame();const d=g.domain,lv=S.levels[g.id]||1;let nl=lv;if(r.success)nl=Math.min(10,lv+1);else if(r.score<40)nl=Math.max(1,lv-1);
  S.levels[g.id]=nl;S.lvMax=S.lvMax||{};S.lvMax[g.id]=Math.max(S.lvMax[g.id]||1,nl);const prev=S.skills[d];S.skills[d]=prev==null?r.score:Math.round(prev*0.6+r.score*0.4);if(S.baseline[d]==null)S.baseline[d]=S.skills[d];
  S.best[g.id]=Math.max(S.best[g.id]||0,r.score);S.points+=r.score;S.history.push({t:Date.now(),g:g.id,s:r.score});if(S.history.length>200)S.history.shift();
  S.played[g.id]=(S.played[g.id]||0)+1;let note=r.note||'';
  if(g.id===weeklyGame().id&&S.weeklyDone!==weekKey()){if(r.score>=WEEKLY_TARGET){S.weeklyDone=weekKey();note='Wyzwanie tygodnia zaliczone! '+note;}else note=`Do wyzwania tygodnia brakuje ${WEEKLY_TARGET-r.score} pkt. `+note;}
  save();const badges=checkBadges();
  stepDone({kind:'game',id:g.id,title:g.name,domain:d,score:r.score,stats:r.stats,levelFrom:lv,levelTo:nl,note:note.trim(),badges});}

function resultView(res){const last=RUN.i>=RUN.steps.length;const label=last?(RUN.mode==='single'?'Gotowe':'Zobacz podsumowanie'):'Dalej';
  const verdict=res.score>=80?'Świetnie!':res.score>=55?'Dobra robota':res.score>=30?'Nieźle, ćwicz dalej':'Rozgrzewka za Tobą';

function review(ids){const items=shuffle(ids.slice()).map(id=>{const l=LESSONS.find(x=>x.id===id);return{l,it:l.quiz[rnd(l.quiz.length)]};});let q=0,good=0;
  function show(){const{l,it}=items[q];
    render(`<div class="screen"><div class="row between">${backBtn()}<span class="small muted">Pytanie ${q+1} z ${items.length}</span></div><span class="chip" style="color:var(--accent)">Powtórka · ${l.title}</span>
      <h2>${it.q}</h2><div class="opts" id="o">${it.o.map((x,i)=>`<button class="opt" data-i="${i}">${x}</button>`).join('')}</div><div id="fb"></div></div>`);
    bindBack();$('#o').onclick=e=>{const b=e.target.closest('.opt');if(!b)return;$('#o').onclick=null;const i=+b.dataset.i;$$('.opt')[it.a].classList.add('ok');const ok=i===it.a;if(ok)good++;else b.classList.add('no');
      const r=S.reviews[l.id]||{stage:0};r.stage=ok?Math.min(INTERVALS.length-1,r.stage+1):0;r.due=addDays(dayKey(),INTERVALS[r.stage]);S.reviews[l.id]=r;save();const iv=INTERVALS[r.stage];
      $('#fb').innerHTML=`<div class="row" style="gap:10px;align-items:flex-start">${mascot('iskra',ok?'cheer':'sad',50,'hop')}<div class="feedback ${ok?'good':'bad'} pop" style="flex:1"><b>${ok?'Pamiętasz!':'Prawidłowo: '+it.o[it.a]}</b>${ok?`Następna powtórka za ${iv} ${plural(iv,'dzień','dni','dni')}.`:'Wrócimy do tego jutro.'}</div></div><button class="btn primary block" id="nx" style="margin-top:12px">${q<items.length-1?'Następne pytanie':'Zakończ powtórkę'}</button>`;
      $('#nx').onclick=()=>{q++;if(q<items.length)show();else end();};};}
  function end(){S.reviewsDone=(S.reviewsDone||0)+1;const score=Math.round(good/items.length*100);S.points+=score;save();const badges=checkBadges();
    stepDone({kind:'review',title:'Powtórka',score,stats:`Pamiętasz ${good} z ${items.length}`,badges});}

     O('Paczka utknęła w magazynie. Przepraszam, to nasz błąd. Wyślę ją dziś ekspresem, dotrze jutro.',2,'wow','Jutro? No, to już coś.','Prawda, przeprosiny i konkretny termin. Trzy rzeczy, które odbudowują zaufanie.'),
     O('Hm, coś się stało w systemie… nie wiem dokładnie.',0,'sad','Nie wiecie nawet, gdzie jest moja paczka?!','Niepewność i brak konkretu zwiększają niepokój klienta.'),
     O('Na pewno niedługo dotrze.',1,'think','„Niedługo” słyszę od tygodnia.','Uspokajasz, ale bez konkretów to obietnica bez pokrycia.')]},
   {say:'No dobrze. Ale to już drugi raz w tym roku.',q:'Jak zamykasz rozmowę?',o:[
     O('Ma Pan rację, to nie powinno się powtarzać. Dodam darmową dostawę przy kolejnym zamówieniu i sprawdzę, co poszło nie tak.',2,'happy','Doceniam. Dziękuję za pomoc.','Przyznajesz rację, rekompensujesz i obiecujesz poprawę. Klient zostaje z Wami.'),
     O('No cóż, zdarza się.',0,'angry','Zdarza się? Następnym razem zamówię gdzie indziej.','Bagatelizowanie problemu to szybka droga do utraty klienta.'),
     O('Przekażę uwagi dalej.',1,'think','Mhm. Zobaczymy.','Poprawnie, ale bez gestu. Klient nie czuje, że ktoś się nim zajął.')]}],
  end:{good:'Pan Marek kończy rozmowę spokojny i zostaje Waszym klientem. Mistrzowsko!',mid:'Sytuacja opanowana, choć klient nie jest w pełni przekonany.',bad:'Klient odkłada słuchawkę zły. Najpierw emocje, potem fakty, na końcu rozwiązanie.'}},
 {id:'kumpel',title:'Kumpel znowu się spóźnia',skill:'Stawianie granic',place:'cafe',npc:{who:'kreatywnosc',name:'Kuba'},
  intro:'Czekasz w kawiarni już 30 minut. Kuba spóźnia się trzeci raz z rzędu.',
  steps:[
   {say:'Sorki, sorki! Korki były straszne!',q:'Co mówisz?',o:[
     O('Cieszę się, że jesteś, ale czekam pół godziny i to już trzeci raz. Trochę mnie to irytuje.',2,'sad','Kurczę… masz rację. Głupio mi.','Komunikat „ja”: mówisz o faktach i swoich uczuciach, bez obrażania.'),
     O('Spoko, nic się nie stało.',0,'happy','No właśnie! To co zamawiamy?','Udajesz, że jest okej. Kuba nie ma szansy się dowiedzieć, że coś jest nie tak.'),
     O('Ty zawsze się spóźniasz. Jesteś totalnie niepoważny.',0,'angry','No bez przesady, raz się zdarzyło!','„Zawsze” i ocena charakteru wywołują obronę zamiast refleksji.')]},
   {say:'No ale wiesz, mam teraz tyle na głowie…',q:'Jak odpowiadasz?',o:[
     O('Rozumiem, że masz dużo spraw. Może po prostu napisz, jeśli widzisz, że się spóźnisz?',2,'think','Jasne, to mogę robić.','Uznajesz jego sytuację i proponujesz prostą, konkretną zmianę.'),
     O('Każdy ma dużo na głowie.',1,'sad','No… niby tak.','Prawda, ale bez propozycji rozwiązania rozmowa utknie.'),
     O('To nie mój problem.',0,'angry','Okej, to może w ogóle się nie spotykajmy.','Ostre odcięcie może zaszkodzić przyjaźni bardziej niż spóźnienie.')]},
   {say:'Dobra, następnym razem będę na czas. Obiecuję!',q:'Jak to kwitujesz?',o:[
     O('Super, dzięki. To co, ja stawiam pierwszą kawę?',2,'cheer','Haha, to ja stawiam drugą!','Po trudnym temacie wracasz do ciepła. Przyjaźń jest ważniejsza niż spór.'),
     O('Zobaczymy.',1,'think','Ej, no serio, postaram się.','Sceptycyzm jest zrozumiały, ale lepiej zakończyć na plusie.'),
     O('Już to słyszałem.',0,'sad','No to chyba nie ma o czym gadać…','Wypominanie przeszłości przekreśla jego próbę poprawy.')]}],
  end:{good:'Powiedziałeś, co Ci przeszkadza, a przyjaźń wyszła z tego mocniejsza.',mid:'Temat poruszony, choć przydałoby się więcej ciepła.',bad:'Rozmowa skończyła się chłodno. Spróbuj komunikatu „ja”: fakt, uczucie, prośba.'}},
 {id:'prezentacja',title:'Trudne pytanie po prezentacji',skill:'Pewność siebie',place:'meeting',npc:{who:'logika',name:'Tomek'},
  intro:'Kończysz prezentację dla zespołu. Tomek podnosi rękę.',
  steps:[
   {say:'A jakie będą koszty utrzymania tego rozwiązania za dwa lata?',q:'Nie znasz dokładnej odpowiedzi. Co mówisz?',o:[
     O('Dobre pytanie. Nie mam teraz dokładnej liczby. Sprawdzę i wyślę ją wszystkim do piątku.',2,'happy','Jasne, dzięki!','Przyznanie się do niewiedzy z konkretną obietnicą buduje wiarygodność.'),
     O('Eee… pewnie podobne jak teraz… chyba.',0,'think','Chyba? To trochę mało.','Zgadywanie podważa całą prezentację.'),
     O('To nie jest teraz istotne.',0,'angry','Dla budżetu jest bardzo istotne.','Zbywanie pytań wygląda na unikanie tematu.')]},
   {say:'A nie boisz się, że zespół nie da rady tego wdrożyć?',q:'Pytanie brzmi jak podważanie. Jak reagujesz?',o:[
     O('Rozumiem obawę. Dlatego proponuję pilotaż na jednym projekcie. Co Ty byś dodał do planu?',2,'wow','Pilotaż to dobry pomysł. Mogę pomóc przy testach.','Traktujesz krytykę jak wkład i zapraszasz krytyka do współpracy.'),
     O('Damy radę, na pewno.',1,'think','Mhm, zobaczymy.','Pewność siebie jest dobra, ale bez argumentu nie przekonuje.'),
     O('Jak ktoś nie da rady, to jego problem.',0,'angry','Wow… no to powodzenia.','Lekceważenie obaw zespołu odbiera Ci sojuszników.')]},
   {say:'Okej, ja jestem na tak.',q:'Jak kończysz?',o:[
     O('Dzięki, Tomek! Twoje pytania naprawdę poprawiły ten plan.',2,'cheer','Spoko, fajnie się z Tobą pracuje.','Docenienie krytyka zamienia go w sprzymierzeńca.'),
     O('No wreszcie.',0,'sad','Ech…','Ironia na koniec psuje to, co udało się zbudować.'),
     O('Dobra, to tyle. Dzięki wszystkim.',1,'happy','Dzięki!','Poprawnie, choć można było docenić wkład Tomka.')]}],
  end:{good:'Zamieniasz trudne pytania w lepszy plan i zyskujesz sojusznika.',mid:'Prezentacja obroniona. Następnym razem zaproś krytyków do współpracy.',bad:'Trudne pytania wybiły Cię z rytmu. „Nie wiem, sprawdzę” to mocna odpowiedź.'}},
 {id:'wsparcie',title:'Ciężki dzień bliskiej osoby',skill:'Empatia',place:'home',npc:{who:'pamiec',name:'Ania'},
  intro:'Bliska osoba wraca wieczorem po ciężkim dniu i rzuca torbę w kąt.',
  steps:[
   {say:'Nawet nie pytaj. Dzień był okropny.',q:'Co robisz?',o:[
     O('Chodź, usiądź. Zrobić Ci herbatę? Pogadamy, jak będziesz chciała.',2,'think','…Tak, poproszę. Dzięki.','Dajesz wsparcie bez nacisku. Najpierw ukojenie, potem rozmowa.'),
     O('U mnie też był ciężki dzień.',0,'sad','Super. To mamy oboje kiepsko.','Licytacja zmęczenia sprawia, że nikt nie czuje się wysłuchany.'),
     O('A zrobiłaś zakupy?',0,'angry','Serio? To jest teraz najważniejsze?','Sprawy praktyczne mogą poczekać. Teraz liczą się emocje.')]},
   {say:'Szef znowu skrytykował mój projekt przy wszystkich.',q:'Jak reagujesz?',o:[
     O('Przy wszystkich? To musiało być bardzo przykre.',2,'sad','Właśnie! Poczułam się jak uczennica.','Nazywasz emocję i pokazujesz, że rozumiesz. To najsilniejsze wsparcie.'),
     O('Na Twoim miejscu od razu bym mu powiedział, co myślę.',1,'think','Łatwo Ci mówić…','Rada padła za szybko. Najpierw wysłuchaj do końca.'),
     O('Może po prostu projekt nie był dobry?',0,'angry','Dzięki za wsparcie…','Nawet jeśli coś w tym jest, teraz brzmi to jak atak.')]},
   {say:'Sama nie wiem, czy mam się tym przejmować.',q:'Co mówisz?',o:[
     O('Chcesz, żebyśmy razem zastanowili się, co z tym zrobić, czy wolisz dziś po prostu odpocząć?',2,'happy','Dziś odpocznijmy. Jutro pogadamy. Dzięki, że jesteś.','Pytasz, czego potrzebuje: rozwiązania czy wsparcia. To złoty środek.'),
     O('Nie przejmuj się, to nic takiego.',0,'sad','Dla mnie to było coś.','„Nie przejmuj się” unieważnia uczucia.'),
     O('Zrób listę argumentów i jutro z nim pogadaj.',1,'think','Może… ale nie dziś.','Dobra rada, ale lepiej najpierw zapytać, czy ktoś jest na nią gotowy.')]}],
  end:{good:'Bliska osoba czuje się wysłuchana i wspierana. Wieczór uratowany.',mid:'Było wsparcie, choć rady pojawiały się trochę za szybko.',bad:'Zabrakło empatii. Najpierw wysłuchaj, potem doradzaj, i to dopiero, gdy ktoś tego chce.'}},
 {id:'sasiad',title:'Głośny sąsiad',skill:'Asertywność',place:'stairs',npc:{who:'reakcja',name:'Sąsiad'},
  intro:'Jest 23:00. Zza ściany od godziny dudni muzyka, a rano masz ważne spotkanie. Pukasz do drzwi.',
  steps:[
   {say:'No? O co chodzi?',q:'Co mówisz?',o:[
     O('Dobry wieczór, mieszkam za ścianą. Muzyka jest dość głośna, a ja jutro wcześnie wstaję. Mógłby Pan ściszyć?',2,'think','A, aż tak słychać? No dobra.','Przedstawiasz się, mówisz konkretnie, o co chodzi, i grzecznie prosisz.'),
     O('Pan wie, która jest godzina?!',0,'angry','Wiem. I co z tego?','Atak od progu wywołuje kontratak.'),
     O('Eee… nic, przepraszam, pomyliłem drzwi.',0,'wow','Aha. Dobranoc.','Rezygnujesz ze swojej potrzeby. Muzyka gra dalej, a Ty nie śpisz.')]},
   {say:'Ale to moja impreza urodzinowa, raz w roku!',q:'Jak reagujesz?',o:[
     O('O, wszystkiego najlepszego! Rozumiem, że świętujecie. Może po prostu trochę ciszej?',2,'happy','Dzięki! Dobra, ściszę o połowę.','Uznajesz jego perspektywę i proponujesz kompromis, na który łatwo się zgodzić.'),
     O('Nie obchodzi mnie to.',0,'angry','A mnie nie obchodzi Pana spotkanie.','Lekceważenie jego święta zamienia prośbę w konflikt.'),
     O('No to trudno, wezmę zatyczki do uszu.',1,'happy','No i super!','Uprzejmie, ale rezygnujesz z prawa do ciszy nocnej.')]},
   {say:'Sorry za kłopot. Może wpadnie Pan na kawałek tortu?',q:'Jak kończysz?',o:[
     O('Dzięki, bardzo miło! Dziś muszę się wyspać, ale wszystkiego dobrego!',2,'cheer','Jasne, dobranoc!','Zamykasz rozmowę ciepło. Dobre relacje z sąsiadami to skarb.'),
     O('Nie, dzięki.',1,'think','No, jak Pan chce.','Poprawnie, ale chłodno. Wystarczyło dodać dobre słowo.'),
     O('Wolałbym, żeby to się nie powtarzało.',1,'sad','No dobra, dobra…','Jasno, ale po jego geście przeprosin zabrzmiało zbyt surowo.')]}],
  end:{good:'Cisza, dobre relacje i kawałek tortu w zanadrzu. Asertywność z klasą!',mid:'Jest ciszej, choć rozmowa mogła być cieplejsza.',bad:'Ani ciszy, ani dobrych relacji. Przedstaw się, opisz problem i poproś konkretnie.'}},
 {id:'pomysl',title:'Ktoś przypisał sobie Twój pomysł',skill:'Konfrontacja bez kłótni',place:'office',npc:{who:'uwaga',name:'Michał'},
  intro:'Na spotkaniu Michał przedstawił pomysł, który zaproponowałeś mu tydzień temu. Wszyscy go chwalili. Po spotkaniu podchodzisz do niego.',
  steps:[
   {say:'Hej, co tam?',q:'Jak zaczynasz?',o:[
     O('Chciałem pogadać o spotkaniu. Ten pomysł z automatyzacją raportów to było coś, o czym rozmawialiśmy tydzień temu. Poczułem się pominięty.',2,'wow','Oj… faktycznie, nie wspomniałem o Tobie.','Spokojnie opisujesz fakty i swoje odczucia. Nie oskarżasz, a i tak sprawa jest jasna.'),
     O('Ukradłeś mój pomysł!',0,'angry','Słucham?! Nic nie ukradłem!','Oskarżenie wywołuje obronę i kłótnię zamiast rozwiązania.'),
     O('Nic, wszystko gra.',0,'happy','No to super!','Przemilczasz sprawę. Następnym razem może być tak samo.')]},
   {say:'Ale wiesz, ja go dopracowałem i dodałem dużo od siebie.',q:'Co odpowiadasz?',o:[
     O('Jasne, Twoja praca była ważna. Chodzi mi o to, żeby oba nasze wkłady były widoczne.',2,'think','Okej, to fair.','Doceniasz jego wkład i jasno mówisz, czego potrzebujesz.'),
     O('Bez mojego pomysłu nie byłoby czego dopracowywać.',1,'sad','No… może i tak.','Masz rację, ale ton licytacji utrudnia porozumienie.'),
     O('Dobra, nieważne.',0,'happy','Spoko!','Wycofujesz się w momencie, gdy rozmowa szła dobrze.')]},
   {say:'To co proponujesz?',q:'Jak to rozwiązać?',o:[
     O('Napiszmy razem maila do zespołu z planem wdrożenia, podpisanego przez nas obu.',2,'cheer','Dobry pomysł, zróbmy to jeszcze dziś.','Konkretne rozwiązanie, które naprawia sytuację i nikogo nie upokarza.'),
     O('Powiedz szefowi, że to był mój pomysł.',1,'think','Hm… trochę dziwnie to zabrzmi.','Zrozumiała prośba, ale stawia go w niezręcznej sytuacji.'),
     O('Następnym razem nic Ci nie powiem.',0,'sad','Szkoda, bo dobrze nam się współpracowało.','Groźba zamyka współpracę, która mogła być wartościowa.')]}],
  end:{good:'Pod pomysłem są Wasze oba nazwiska, a współpraca kwitnie. Konfrontacja bez kłótni!',mid:'Sprawa wyjaśniona, choć bez pełnej satysfakcji.',bad:'Konflikt narasta albo został zamieciony pod dywan. Fakty, uczucia, prośba: to działa.'}},
 {id:'feedback',title:'Uwagi dla młodszego kolegi',skill:'Dawanie feedbacku',place:'office',npc:{who:'pamiec',name:'Filip'},
  intro:'Filip, młodszy kolega, oddał raport z wieloma błędami. Masz mu przekazać uwagi.',
  steps:[
   {say:'Hej! I jak raport? Starałem się!',q:'Od czego zaczynasz?',o:[
     O('Widać, że włożyłeś w niego dużo pracy, a struktura jest super. Mam kilka uwag, które go jeszcze poprawią. Masz chwilę?',2,'happy','Jasne, dawaj!','Zaczynasz od konkretnej pochwały i zapowiadasz uwagi. Filip jest otwarty.'),
     O('Słabo. Pełno błędów.',0,'sad','Aha… przepraszam.','Ogólna, ostra ocena zniechęca i nie mówi, co poprawić.'),
     O('Jest okej.',1,'happy','Super, to wysyłam do klienta!','Unikasz trudnej rozmowy, a błędy trafią do klienta.')]},
   {say:'Co dokładnie jest nie tak?',q:'Co mówisz?',o:[
     O('W tabeli na stronie 3 sumy się nie zgadzają, a wnioski nie wynikają z danych. Pokażę Ci, jak to sprawdzam.',2,'think','Aaa, widzę! Dzięki, że pokazujesz.','Konkretne przykłady i pomoc w nauce. Tak wygląda dobry feedback.'),
     O('No wszystko po trochu.',0,'wow','Ale… od czego mam zacząć?','Bez konkretów Filip nie wie, co poprawić.'),
     O('Sam zobacz, przecież to widać.',0,'sad','No… postaram się znaleźć.','Zostawiasz go samego z problemem i obniżasz jego pewność siebie.')]},
   {say:'Poprawię to do jutra. Coś jeszcze?',q:'Jak kończysz?',o:[
     O('Nie, dzięki. Fajnie, że tak szybko łapiesz. Przed oddaniem przejrzyj jeszcze sumy, to łatwy nawyk.',2,'cheer','Dzięki! Zapisuję sobie.','Kończysz pozytywnie i zostawiasz jedną konkretną wskazówkę.'),
     O('Tak, bądź bardziej uważny.',1,'sad','Okej…','Ogólnik bez wskazówki, jak to zrobić.'),
     O('Żeby to był ostatni raz.',0,'sad','Dobrze…','Groźba na koniec niszczy motywację, którą udało się zbudować.')]}],
  end:{good:'Filip poprawia raport i sam dziękuje za uwagi. Feedback, który uczy!',mid:'Uwagi przekazane, choć można było zrobić to bardziej wspierająco.',bad:'Filip jest zniechęcony albo nie wie, co poprawić. Pochwała, konkret, wskazówka.'}},
 {id:'swieta',title:'Rodzinne naciski',skill:'Asertywność w rodzinie',place:'home',npc:{who:'kreatywnosc',name:'Ciocia'},
  intro:'Ciocia dzwoni w sprawie świąt. W tym roku planujecie spędzić je w domu.',
  steps:[
   {say:'No to oczywiście przyjeżdżacie do nas na całe święta, prawda?',q:'Co odpowiadasz?',o:[
     O('Ciociu, bardzo dziękujemy za zaproszenie. W tym roku zostajemy w domu, ale chętnie wpadniemy w drugi dzień świąt.',2,'think','Oj, w domu? No… a na ile byście wpadli?','Dziękujesz, jasno mówisz o decyzji i proponujesz alternatywę.'),
     O('No… chyba tak.',0,'cheer','Wspaniale! To od Wigilii do niedzieli!','Mówisz „tak”, choć myślisz „nie”. Teraz trudniej będzie się wycofać.'),
     O('Nie, mamy dość tych rodzinnych spędów.',0,'angry','Spędów?! No wiesz co!','Szczerość bez taktu rani i zaczyna konflikt.')]},
   {say:'Ale babcia będzie bardzo smutna…',q:'Jak reagujesz?',o:[
     O('Wiem, że babci na tym zależy. Zadzwonimy do niej w Wigilię, a w drugi dzień przyjedziemy na obiad.',2,'happy','No… babcia na pewno ucieszy się z obiadu.','Uznajesz uczucia, ale nie zmieniasz decyzji pod wpływem poczucia winy.'),
     O('Dobra, to może jednak przyjedziemy.',0,'cheer','No widzisz! Wiedziałam!','Poczucie winy zadziałało. Twoja potrzeba zniknęła ze stołu.'),
     O('To nie moja wina, że babcia będzie smutna.',0,'angry','Ale z Ciebie zimna osoba…','Technicznie prawda, ale brzmi chłodno i zaostrza rozmowę.')]},
   {say:'No dobrze… to w drugi dzień świąt na obiad.',q:'Jak kończysz?',o:[
     O('Super, nie możemy się doczekać! Przywieziemy sernik.',2,'cheer','O, sernik! To czekamy!','Kończysz z entuzjazmem i drobnym gestem. Wszyscy wygrywają.'),
     O('Tak, ale tylko na chwilę.',1,'sad','Aha… no dobrze.','Jasne granice są w porządku, ale „tylko na chwilę” brzmi jak łaska.'),
     O('Okej.',1,'think','No to do zobaczenia.','Poprawnie, ale można było dodać trochę ciepła.')]}],
  end:{good:'Święta po Waszemu i zadowolona rodzina. Asertywność z sercem!',mid:'Decyzja obroniona, choć zabrakło trochę ciepła.',bad:'Ustąpiłeś albo doszło do kłótni. Podziękuj, powiedz o decyzji, zaproponuj alternatywę.'}},
 {id:'rekrutacja',title:'Rozmowa kwalifikacyjna',skill:'Autoprezentacja',place:'meeting',npc:{who:'logika',name:'Rekruterka'},
  intro:'Rozmowa o pracę marzeń. Po przywitaniu rekruterka zadaje pierwsze pytanie.',
  steps:[
   {say:'Proszę opowiedzieć coś o sobie.',q:'Co mówisz?',o:[
     O('Od kilku lat pracuję w IT. W ostatnim projekcie skróciłem czas wydań o połowę. Szukam miejsca, gdzie będę mógł rozwijać się w nowych technologiach.',2,'wow','Konkretnie. To brzmi ciekawie.','Krótko: kim jesteś, czym się chwalisz i czego szukasz. Z liczbą, która zapada w pamięć.'),
     O('Urodziłem się w… no, to długa historia.',0,'think','Mamy około 30 minut…','Życiorys od urodzenia to za dużo. Skup się na tym, co ważne dla tej pracy.'),
     O('Wszystko jest w CV.',0,'sad','Wolałabym usłyszeć to od Pana.','Rekruter chce zobaczyć, jak mówisz o sobie, a nie tylko co napisałeś.')]},

 {id:'cisza',group:'tow',title:'Niezręczna cisza w windzie',skill:'Small talk',place:'office',npc:{who:'pamiec',name:'Ewa z księgowości'},

 {id:'komplement',group:'tow',title:'Przyjmowanie komplementu',skill:'Pewność siebie',place:'office',npc:{who:'spostrzegawczosc',name:'Szefowa'},
  intro:'Po spotkaniu szefowa zatrzymuje Cię na korytarzu.',
  steps:[

     O('„Eee, to nic takiego, miałem szczęście.”',1,'think','Szczęście? Raczej dobre przygotowanie.','Umniejszanie siebie brzmi jak brak pewności siebie, a nawet podważa jej ocenę.'),

     O('„Bardzo pomogła mi Kasia z analityki. Bez niej trwałoby to tydzień dłużej.”',2,'cheer','Super, że to mówisz. Podziękuję jej.','Docenianie innych pokazuje klasę i buduje zaufanie w zespole.'),
     O('„Siedziałem po nocach.”',1,'think','Doceniam, ale dbaj też o siebie.','Szczere, ale lepiej pokazywać skuteczność niż poświęcenie.'),

   {say:'Chcesz poprowadzić prezentację dla zarządu w przyszłym miesiącu?',q:'Jak odpowiadasz?',o:[
     O('„Bardzo chętnie! Umówimy się na krótką rozmowę o oczekiwaniach zarządu?”',2,'cheer','Jasne, wpiszę nam spotkanie.','Entuzjazm i konkretny następny krok. Pokazujesz, że podchodzisz do tego poważnie.'),
     O('„Nie wiem, czy dam radę…”',1,'think','Wierzę, że dasz.','Skromność jest okej, ale za dużo wątpliwości może odebrać Ci szansę.'),
     O('„Pewnie, to dla mnie bułka z masłem.”',0,'wow','Zobaczymy…','Przesadna pewność siebie budzi wątpliwości.')]}],
  end:{good:'Przyjąłeś pochwałę z klasą, doceniłeś zespół i dostałeś nowe zadanie. Brawo!',mid:'Dobrze, choć komplementy warto przyjmować prostym „dziękuję”.',bad:'Komplement nie wybrzmiał. Podziękuj, doceń innych, zrób następny krok.'}},
 {id:'koniec',group:'tow',title:'Jak grzecznie zakończyć rozmowę',skill:'Kończenie rozmowy',place:'party',npc:{who:'reakcja',name:'Gienek'},

     O('„Nudzisz mnie.”',0,'angry','No wiesz co…','Prawda bywa okrutna. Da się zakończyć rozmowę bez ranienia.'),
     O('Słuchasz przez kolejne 40 minut.',0,'think','…i wtedy powiedziałem sprzedawcy…','Grzeczność nie oznacza poświęcania całego wieczoru. Masz prawo zakończyć rozmowę.')]},
   {say:'A może jeszcze opowiem Ci o nożach do niej?',q:'Co mówisz?',o:[
     O('„Następnym razem chętnie! Może pokażesz mi ją, jak będę u Ciebie?”',2,'cheer','O, super, zapraszam!','Odkładasz temat na później i kończysz ciepło.'),
     O('„Nie, dzięki.”',1,'think','No dobra.','Jasno, choć trochę chłodno.'),
     O('Uciekasz bez słowa.',0,'sad','Halo? Gdzie poszedł?','Ucieczka bez słowa jest niegrzeczna i zostanie zapamiętana.')]},
   {say:'Dobra, leć, bawcie się dobrze!',q:'Jak się żegnasz?',o:[

     O('„Wreszcie!”',0,'angry','Słucham?','Zniecierpliwienie na koniec niszczy całą uprzejmość.'),
     O('Machasz ręką i odchodzisz.',1,'happy','Pa!','Okej, ale słowo pożegnania byłoby milsze.')]}],

);

const SCENE_META={spoznienie:{npc:{who:'logika',name:'Bartek'},place:'cafe'},emocje:{npc:{who:'pamiec',name:'Rozmówca'},place:'home'},sluchanie:{npc:{who:'uwaga',name:'Znajoma'},place:'cafe'},
  odmowa:{npc:{who:'spostrzegawczosc',name:'Szefowa'},place:'office'},negocjacje:{npc:{who:'kreatywnosc',name:'Przyjaciel'},place:'cafe'},konflikt:{npc:{who:'logika',name:'Tomek'},place:'meeting'}};
const GEN_R={2:['Dobra, to ma sens.','Dzięki, doceniam to.','Okej, rozumiem.'],1:['Hmm…','No… może.','Aha.'],0:['Serio?','No wiesz co…','Ech.']};
function normScene(sc){const meta=SCENE_META[sc.id]||{};
  return{...sc,npc:sc.npc||meta.npc||{who:'uwaga',name:'Rozmówca'},place:sc.place||meta.place||'cafe',
    steps:sc.steps.map(s=>s.say!==undefined?s:{cap:s.text,say:s.quote?s.quote.replace(/^„|”$/g,''):null,q:s.q,o:s.o.map(o=>({...o,m:o.p===2?'happy':o.p===1?'think':'sad',r:GEN_R[o.p][rnd(3)]}))}),
    end:sc.end||{good:'Świetnie poprowadzona rozmowa!',mid:'Nieźle, ale można lepiej.',bad:'Ta rozmowa nie poszła najlepiej. Spróbuj jeszcze raz.'}};}
function scene(raw){const sc=normScene(raw);let k=0,pts=0,mood=50,timers=[],skip=null;const later=(f,ms)=>timers.push(setTimeout(f,ms));const NM=sc.npc.name;
  DN=2;render(`<div class="screen"><div class="row between">${backBtn()}${progressTxt()}</div>
    <div class="row between"><span class="chip" style="color:${dcol(sc.npc.who)}">${sc.skill}</span><span class="small muted" id="stp"></span></div>
    <h1>${sc.title}</h1>
    <section class="sc-stage pl-${sc.place}" id="stg"><div class="sc-deco"></div><div class="sc-floor"></div>
      <div class="sc-me" id="me">${mascot('iskra','happy',92,'')}<span class="sc-name">Ty</span></div>
      <div class="sc-npc" id="npc">${mascot(sc.npc.who,'happy',104,'')}<span class="sc-name">${NM}</span></div>
      <div class="sc-bub npc" id="bn" hidden></div><div class="sc-bub me" id="bm" hidden></div>
      <span class="sc-skip">Dotknij, żeby przyspieszyć</span></section>
    <div class="sc-mood"><span class="small muted">Nastrój rozmowy</span><div class="meter"><i id="mt" style="width:50%;background:var(--warn)"></i></div></div>
    <p class="sc-cap" id="cap"></p><h3 id="q"></h3><div class="opts" id="o"></div><div id="tip"></div></div>`);
  bindBack(softList);cleanup=()=>timers.forEach(clearTimeout);
  const npc=$('#npc'),bn=$('#bn'),bm=$('#bm');$('#stg').onclick=()=>{if(skip)skip();};
  const setMood=(m,cls)=>{npc.innerHTML=mascot(sc.npc.who,m,104,cls||'')+`<span class="sc-name">${NM}</span>`;};
  function type(el,text,cb){el.hidden=false;el.classList.remove('in');void el.offsetWidth;el.classList.add('in');
    if(reduceMotion()){el.textContent=text;cb&&cb();return;}let i=0;el.textContent='';
    skip=()=>{skip=null;timers.forEach(clearTimeout);timers=[];el.textContent=text;cb&&cb();};
    (function tick(){i+=2;el.textContent=text.slice(0,i);if(i<text.length)later(tick,28);else{skip=null;cb&&cb();}})();}
  function step(){const s=sc.steps[k];$('#stp').textContent=`Sytuacja ${k+1} z ${sc.steps.length}`;$('#tip').innerHTML='';$('#o').innerHTML='';$('#q').textContent='';bm.hidden=true;bn.hidden=true;
    $('#cap').textContent=(k===0&&sc.intro?sc.intro+' ':'')+(s.cap||'');setMood('happy','react');
    const show=()=>{$('#q').textContent=s.q||'Co odpowiadasz?';$('#o').innerHTML=s.o.map((x,i)=>`<button class="opt sc-opt" data-i="${i}" style="animation-delay:${i*.08}s">${x.t}</button>`).join('');$('#o').onclick=pick;};
    later(()=>{if(s.say)type(bn,s.say,show);else show();},450);}
  function pick(e){const b=e.target.closest('.opt');if(!b)return;$('#o').onclick=null;const ch=sc.steps[k].o[+b.dataset.i];pts+=ch.p;
    mood=clamp(mood+(ch.p===2?18:ch.p===1?0:-18),0,100);
    $$('#o .opt').forEach(x=>{if(x!==b)x.classList.add('dim');});b.classList.add('picked');$('#q').textContent='';bn.hidden=true;
    type(bm,ch.t,()=>later(()=>{bm.hidden=true;setMood(ch.m||'happy',ch.p===0?'shake':ch.p===2?'cheer':'react');
      const mt=$('#mt');mt.style.width=mood+'%';mt.style.background=mood>=60?'var(--good)':mood>=40?'var(--warn)':'var(--bad)';
      const after=()=>{const cls=ch.p===2?'good':ch.p===1?'mid':'bad';const ttl=ch.p===2?'Trafnie':ch.p===1?'Częściowo':'To nie pomoże';
        $('#tip').innerHTML=`<div class="row" style="gap:10px;align-items:flex-start">${mascot('iskra',ch.p===2?'cheer':ch.p===1?'think':'sad',46,'hop')}<div class="feedback ${cls} pop" style="flex:1"><b>${ttl}</b>${ch.f}</div></div><button class="btn primary block" id="nx" style="margin-top:10px">${k<sc.steps.length-1?'Dalej':'Zakończ rozmowę'}</button>`;
        $('#nx').onclick=()=>{k++;if(k<sc.steps.length)step();else end();};$('#nx').scrollIntoView({behavior:reduceMotion()?'auto':'smooth',block:'nearest'});};
      if(ch.r)type(bn,ch.r,after);else after();},700));}
  function end(){const max=sc.steps.length*2,score=Math.round(pts/max*100),tier=score>=80?'good':score>=45?'mid':'bad';
    $('#o').innerHTML='';$('#q').textContent='';$('#cap').textContent='';bm.hidden=true;setMood(tier==='good'?'cheer':tier==='mid'?'happy':'sad',tier==='good'?'cheer':'react');
    type(bn,{good:'Dzięki za rozmowę!',mid:'No… dobra, pogadamy jeszcze.',bad:'Hmm. Muszę to przemyśleć.'}[tier],()=>{
      S.soft=S.soft==null?score:Math.round(S.soft*.6+score*.4);if(!S.scenesDone.includes(sc.id))S.scenesDone.push(sc.id);S.points+=score;save();const badges=checkBadges();
      $('#tip').innerHTML=`<div class="feedback ${tier} pop"><b>Podsumowanie</b>${sc.end[tier]}</div><button class="btn primary block" id="nx" style="margin-top:10px">Zobacz wynik</button>`;if(tier==='good')confetti(70);
      $('#nx').onclick=()=>stepDone({kind:'scene',title:sc.title,score,stats:`Trafne reakcje: ${pts} z ${max} punktów · nastrój rozmowy: ${mood}%`,badges});});}
  step();}

/* ===================== Lekcja ===================== */
function lesson(l){let k=0,q=0,good=0;
  function card(){render(`<div class="screen"><div class="row between">${backBtn()}${progressTxt()}</div><span class="chip" style="color:var(--accent)">Wiedza · ${l.cat}</span><h1>${l.title}</h1>
      <div class="dots">${l.cards.map((_,i)=>`<i class="${i<=k?'on':''}"></i>`).join('')}<i></i></div>
      ${k===0?buddy('iskra','think',`${l.cards.length} krótkie karty, potem 3 pytania. Lecimy!`,{size:54}):''}<p class="lesson-card pop">${l.cards[k]}</p><button class="btn primary block" id="nx">${k<l.cards.length-1?'Dalej':'Przejdź do quizu'}</button></div>`);
    bindBack();$('#nx').onclick=()=>{k++;if(k<l.cards.length)card();else quiz();};}
  function quiz(){const it=l.quiz[q];
    render(`<div class="screen"><div class="row between">${backBtn()}<span class="small muted">Pytanie ${q+1} z ${l.quiz.length}</span></div><span class="chip" style="color:var(--accent)">Quiz · ${l.title}</span>
      <h2>${it.q}</h2><div class="opts" id="o">${it.o.map((x,i)=>`<button class="opt" data-i="${i}">${x}</button>`).join('')}</div><div id="fb"></div></div>`);
    bindBack();$('#o').onclick=e=>{const b=e.target.closest('.opt');if(!b)return;$('#o').onclick=null;const i=+b.dataset.i;const btns=$$('.opt');btns[it.a].classList.add('ok');
      if(i===it.a)good++;else b.classList.add('no');
      $('#fb').innerHTML=`<div class="row" style="gap:10px;align-items:flex-start">${mascot('iskra',i===it.a?'cheer':'sad',50,'hop')}<div class="feedback ${i===it.a?'good':'bad'} pop" style="flex:1"><b>${i===it.a?'Dobrze':'Prawidłowo: '+it.o[it.a]}</b>${it.why}</div></div><button class="btn primary block" id="nx" style="margin-top:12px">${q<l.quiz.length-1?'Następne pytanie':'Zakończ lekcję'}</button>`;
      $('#nx').onclick=()=>{q++;if(q<l.quiz.length)quiz();else end();};};}
  function end(){const score=Math.round(good/l.quiz.length*100);if(!S.lessonsDone.includes(l.id))S.lessonsDone.push(l.id);if(!S.reviews[l.id])S.reviews[l.id]={stage:0,due:addDays(dayKey(),1)};S.points+=score;save();const badges=checkBadges();
    stepDone({kind:'lesson',title:l.title,score,stats:`Quiz: ${good} z ${l.quiz.length} poprawnie`,note:'Jutro ta lekcja wróci w krótkiej powtórce.',badges});}
  card();}

/* ===================== Start ===================== */
$('#brand').onclick=home;$('#streak').onclick=profile;$$('#tabbar .tab').forEach(b=>b.onclick=()=>({home,gry:devHub,wiedza:knowledge,soft:softList,postep:profile})[b.dataset.tab]());
window.claude?.hot?.snapshot?.(()=>({S}));
function start(data){S=data&&data.S?Object.assign(clone(DEFAULT_STATE),data.S):loadState();home();initCloud();}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
